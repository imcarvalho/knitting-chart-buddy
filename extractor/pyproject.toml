[project]
name = "chart-buddy"
version = "0.1.0"
description = "Extract knitting charts from vector PDFs into structured JSON"
requires-python = ">=3.12"
dependencies = ["pymupdf>=1.24"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chart_buddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
